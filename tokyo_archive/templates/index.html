<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tokyo Archive — High-Contrast Dark Theme</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #080808;
            color: #f2f2f2;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #111;
            border-bottom: 1px solid #222;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #fff;
            text-transform: uppercase;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #fff;
        }

        .cart-btn {
            background: #222;
            border: 1px solid #333;
            color: #fff;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .cart-btn:hover {
            background: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
            flex: 1;
            width: 100%;
        }

        .catalog-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            border-left: 4px solid #fff;
            padding-left: 15px;
        }

        /* Жесткая сетка каталога */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
            align-items: stretch;
        }

        /* Карточка товара */
        .product-card {
            background: #121212;
            border: 1px solid #222;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            transition: border-color 0.2s ease;
            height: 100%;
        }

        .product-card:hover {
            border-color: #444;
        }

        /* Контейнер картинки */
        .product-image-container {
            width: 100%;
            height: 320px;
            background: #000;
            overflow: hidden;
            position: relative;
        }

        .product-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .product-card:hover .product-image-container img {
            transform: scale(1.03);
        }

        /* Текстовый блок */
        .product-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-category {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #777;
            margin-bottom: 6px;
        }

        .product-title {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 12px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid #1a1a1a;
        }

        .product-price {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
        }

        .product-old-price {
            font-size: 13px;
            color: #666;
            text-decoration: line-through;
            margin-left: 8px;
        }

        .buy-btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 3px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .buy-btn:hover {
            opacity: 0.85;
        }

        footer {
            background-color: #0f0f0f;
            border-top: 1px solid #1a1a1a;
            text-align: center;
            padding: 20px;
            color: #555;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo">Tokyo Archive</a>
        <div class="nav-links">
            <a href="/">Каталог</a>
            <a href="{{ url_for('login') }}">Вход</a>
            <a href="{{ url_for('register') }}">Регистрация</a>
            <a href="{{ url_for('cart') }}" class="cart-btn">Корзина (0)</a>
        </div>
    </header>

    <div class="container">
        <div class="catalog-header">
            <h1>Архив товаров</h1>
        </div>

        <div class="product-grid">
            {% for product in products %}
            <div class="product-card">
                <div class="product-image-container">
                    <img src="{{ product.images.split(',')[0] }}" alt="{{ product.name }}" loading="lazy">
                </div>
                <div class="product-info">
                    <div class="product-category">{{ product.category }}</div>
                    <div class="product-title">{{ product.name }}</div>
                    <div class="product-footer">
                        <div>
                            <span class="product-price">{{ product.price }} ₴</span>
                            {% if product.old_price %}
                            <span class="product-old-price">{{ product.old_price }} ₴</span>
                            {% endif %}
                        </div>
                        <button class="buy-btn">В корзину</button>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <footer>
        &copy; 2026 Tokyo Archive. High-Contrast Dark Theme UI.
    </footer>

</body>
</html>
