{% extends "base.html" %}
{% block content %}
<div class="row g-5 py-3">
    <div class="col-md-6">
        <div class="card-custom p-2 mb-3">
            <img id="mainImage" src="{{ images[0] }}" class="w-100 rounded" style="height: 420px; object-fit: cover;">
        </div>
        <div class="row g-2">
            {% for img in images %}
            <div class="col-4">
                <div class="card-custom p-1" style="cursor: pointer;" onclick="document.getElementById('mainImage').src='{{ img }}'">
                    <img src="{{ img }}" class="w-100 rounded" style="height: 90px; object-fit: cover;">
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
    <div class="col-md-6 d-flex flex-column justify-content-center">
        <span class="badge bg-primary bg-opacity-20 text-primary align-self-start mb-2 px-3 py-1">{{ product.category }}</span>
        <h2 class="fw-bold text-white mb-3">{{ product.name }}</h2>
        <div class="mb-3">
            <span class="fs-3 fw-bold text-white me-3">{{ product.price }} грн.</span>
            <span class="text-muted text-decoration-line-through fs-5">{{ product.old_price }} грн.</span>
        </div>
        <p class="text-muted mb-4">{{ product.description }}</p>
        <form action="{{ url_for('add_to_cart', product_id=product.id) }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <button type="submit" class="btn btn-brand btn-lg w-100 py-3">Добавить в корзину</button>
        </form>
        <div class="mt-3"><a href="{{ url_for('index') }}" class="text-muted text-decoration-none">← Назад в каталог</a></div>
    </div>
</div>
{% endblock %}
